<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1a6b;--navy2:#0d2396;--cell:#1230b5;--gold:#ffcc4d;--ink:#fff;--mute:#a9b6f0;--bg:#050b33;--good:#2dd4a0;--bad:#ff5470}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(1200px 700px at 50% -10%,#16278f,var(--bg));color:var(--ink);font:16px/1.4 Inter,system-ui,sans-serif}
.h,h1,h2,.cat,.val,.clue,.big{font-family:Oswald,Impact,sans-serif;text-transform:uppercase}
button,input,select{font:inherit}
.screen{display:none;min-height:100vh;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
.screen.on{display:block}
.wrap{max-width:560px;margin:0 auto}
.logo{font-size:3.4rem;margin:.5em 0 0;color:var(--gold);letter-spacing:.04em;text-shadow:0 4px 0 #000a;text-align:center}
.sub{text-align:center;color:var(--mute);margin:0 0 1.4em}
.card{background:#0b1648cc;border:1px solid #2a3fb5;border-radius:16px;padding:16px;margin-bottom:14px;backdrop-filter:blur(4px)}
label{display:block;color:var(--mute);font-size:.8rem;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.08em}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #2a3fb5;background:#060d3a;color:#fff}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--gold);color:#1a1300;font-weight:700;cursor:pointer;margin-top:10px;font-size:1rem;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.alt{background:#1a2a96;color:#fff;border:1px solid #3a52d6}
.btn.good{background:var(--good);color:#04281e}.btn.bad{background:var(--bad);color:#fff}
.btn.sm{width:auto;padding:8px 12px;margin:0;font-size:.85rem}
.btn:disabled{opacity:.35;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.code{font-size:3.4rem;letter-spacing:.3em;text-align:center;color:var(--gold);font-family:Oswald;padding-left:.3em}
.board-pick{display:flex;flex-direction:column;gap:8px}
.bp{padding:12px;border-radius:12px;border:2px solid #2a3fb5;background:#0a1450;cursor:pointer}
.bp.sel{border-color:var(--gold);background:#17258a}.bp b{font-family:Oswald;text-transform:uppercase;letter-spacing:.04em}.bp span{display:block;color:var(--mute);font-size:.85rem}
.team{border-radius:14px;padding:12px;margin-bottom:10px;border:2px solid var(--c);background:#0a1450}
.team h3{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;color:var(--c);font-family:Oswald;text-transform:uppercase}
.chip{display:inline-block;background:#ffffff1c;border-radius:99px;padding:3px 10px;margin:2px;font-size:.85rem}
/* BOARD */
#play{padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.top .h{color:var(--gold);font-size:1.2rem;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:1200px;margin:0 auto}
.cat{background:var(--navy2);color:#fff;border-radius:8px;padding:10px 4px;text-align:center;font-weight:700;font-size:clamp(.6rem,1.9vw,1.15rem);display:flex;align-items:center;justify-content:center;min-height:clamp(56px,10vw,100px);line-height:1.1;box-shadow:inset 0 -3px 0 #0006}
.cell{background:linear-gradient(180deg,var(--cell),#0e2699);color:var(--gold);border:0;border-radius:8px;font-weight:700;font-size:clamp(1rem,4.2vw,2.8rem);min-height:clamp(52px,11vw,110px);cursor:pointer;text-shadow:0 2px 0 #0009;box-shadow:inset 0 -4px 0 #0007;transition:transform .12s,filter .12s}
.cell:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.2)}
.cell:disabled{background:#0a1450;color:transparent;cursor:default;box-shadow:none;text-shadow:none}
.cell.pl{cursor:default}
.score{display:flex;gap:8px;max-width:1200px;margin:12px auto 0;flex-wrap:wrap}
.sc{flex:1;min-width:120px;background:#0b1648;border-radius:12px;border-bottom:5px solid var(--c);padding:8px 10px;text-align:center;position:relative}
.sc.ctl::before{content:'★ in control';position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:.65rem;background:var(--c);color:#000;border-radius:99px;padding:1px 8px;white-space:nowrap}
.sc .n{font-size:.85rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .s{font-family:Oswald;font-size:1.8rem;font-weight:700}.sc .s.neg{color:var(--bad)}
.sc .adj{display:flex;gap:4px;justify-content:center;margin-top:4px}
.sc .adj button{background:#1a2a96;color:#fff;border:0;border-radius:6px;padding:2px 8px;cursor:pointer}
/* CLUE */
.overlay{position:fixed;inset:0;z-index:50;background:radial-gradient(900px 600px at 50% 30%,#1a30b8,#061050);display:none;flex-direction:column;padding:16px;overflow:auto}
.overlay.on{display:flex;animation:zoom .3s ease-out}
@keyframes zoom{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.ov-top{display:flex;justify-content:space-between;color:var(--gold);font-family:Oswald;text-transform:uppercase;font-size:1.2rem;letter-spacing:.06em}
.clue{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(1.5rem,5.2vw,3.6rem);line-height:1.25;padding:16px;text-shadow:0 3px 0 #0007;font-weight:500;max-width:1100px;margin:0 auto}
.answer{text-align:center;color:var(--gold);font-family:Oswald;font-size:clamp(1.4rem,4vw,2.6rem);text-transform:none;min-height:1.4em}
.ctrl{max-width:700px;width:100%;margin:8px auto 0}
.buzzstat{text-align:center;font-family:Oswald;font-size:1.4rem;text-transform:uppercase;min-height:1.6em;margin:6px 0}
.buzzer{width:min(78vw,300px);height:min(78vw,300px);border-radius:50%;margin:10px auto;display:block;border:0;font-family:Oswald;font-size:2.6rem;color:#fff;background:radial-gradient(circle at 35% 30%,#ff7b8d,#e63946 60%,#a1121f);box-shadow:0 10px 0 #6d0b15,0 20px 40px #0008;cursor:pointer;text-transform:uppercase}
.buzzer:active{transform:translateY(8px);box-shadow:0 2px 0 #6d0b15}
.buzzer:disabled{background:#333b66;box-shadow:0 10px 0 #1b2040;color:#8a93c4}
.pulse{animation:p 1s infinite}@keyframes p{50%{box-shadow:0 10px 0 #6d0b15,0 0 0 18px #ff5470 33}}
.dd{font-family:Oswald;font-size:clamp(2.4rem,9vw,6rem);color:var(--gold);text-align:center;animation:ddp .7s infinite alternate}
@keyframes ddp{to{transform:scale(1.07);color:#fff}}
table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #2a3fb5}
.pod{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:20px 0}
.pod div{flex:1;max-width:160px;text-align:center;background:var(--c);color:#111;border-radius:12px 12px 0 0;padding:10px 4px;font-family:Oswald;text-transform:uppercase}
.small{font-size:.85rem;color:var(--mute)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:99px;font-weight:600;display:none;z-index:99}
</style>
</head>
<body>

<section id="home" class="screen on"><div class="wrap">
  <h1 class="logo">Quizdown</h1><p class="sub">The host runs the board. Everyone else joins on their own device.</p>
  <div class="card">
    <label>Join a game</label>
    <input id="joinCode" maxlength="4" placeholder="CODE" style="text-transform:uppercase;letter-spacing:.4em;text-align:center;font-size:1.4rem" autocomplete="off">
    <label>Your name</label><input id="name" maxlength="16" placeholder="Nickname" autocomplete="off">
    <button class="btn" id="join">Join</button>
  </div>
  <div class="card"><label style="margin-top:0">Or host a game (use a laptop or TV)</label>
    <div class="board-pick" id="boards"></div>
    <label>Number of teams</label><select id="nteams"><option>2</option><option>3</option><option>4</option></select>
    <button class="btn alt" id="host">Host game</button></div>
</div></section>

<section id="lobby" class="screen"><div class="wrap">
  <div class="small" style="text-align:center">Join at this page with code</div><div class="code" id="lcode"></div>
  <div class="small" style="text-align:center;margin-bottom:12px" id="lurl"></div>
  <div id="teamsBox"></div>
  <div class="card" id="unBox"><b>Waiting to pick a team</b><div id="unassigned" style="margin-top:6px"></div></div>
  <div id="hostLobby">
    <div class="card"><label style="margin-top:0">Teams</label><select id="teamCount"><option>2</option><option>3</option><option>4</option></select>
      <div id="tnames"></div></div>
    <button class="btn" id="startGame">Start game</button>
  </div>
  <p class="small" id="waitMsg" style="text-align:center"></p>
</div></section>

<section id="play" class="screen">
  <div class="top"><div class="h" id="ptitle"></div><div class="row" style="flex:none" id="topBtns"></div></div>
  <div class="grid" id="grid"></div>
  <div class="score" id="score"></div>
  <div class="overlay" id="ov"></div>
</section>

<section id="end" class="screen"><div class="wrap">
  <h1 class="logo">Final scores</h1><div class="pod" id="pod"></div>
  <button class="btn" onclick="location.href=location.pathname">Play again</button>
</div></section>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let ws, S, boardId = 'pop', screen = 'home';
const show = (id) => { screen = id; document.querySelectorAll('.screen').forEach((e) => e.classList.toggle('on', e.id === id)); };
function toast(t){ const e=$('#toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',3000); }
$('#name').value = store.get('qd_name') || '';
const qp = new URLSearchParams(location.search); if (qp.get('join')) $('#joinCode').value = qp.get('join');

fetch('/api/boards').then((r) => r.json()).then((bs) => {
  $('#boards').innerHTML = bs.map((b) => `<div class="bp ${b.id === boardId ? 'sel' : ''}" data-id="${b.id}"><b>${esc(b.title)}</b><span>${esc(b.blurb)}</span></div>`).join('');
  document.querySelectorAll('.bp').forEach((el) => el.onclick = () => { boardId = el.dataset.id; document.querySelectorAll('.bp').forEach((x) => x.classList.toggle('sel', x === el)); });
});

function connect(first) {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/quiz`);
  ws.onopen = first;
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => { if (S && S.phase !== 'ended') setTimeout(() => connect(() => send({ type: 'join', code: S.code, token: store.get('qd_token'), name: store.get('qd_name') })), 1500); };
}
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
$('#host').onclick = () => connect(() => send({ type: 'create', board: boardId, teams: +$('#nteams').value }));
$('#join').onclick = () => {
  const n = $('#name').value.trim(), code = $('#joinCode').value.trim().toUpperCase();
  if (!n) return toast('Enter a nickname'); if (code.length !== 4) return toast('Codes have 4 letters');
  store.set('qd_name', n);
  connect(() => send({ type: 'join', code, name: n, token: store.get('qd_code') === code ? store.get('qd_token') : '' }));
};
function handle(m) {
  if (m.type === 'error') return toast(m.text);
  if (m.type === 'joined') { store.set('qd_token', m.token); store.set('qd_code', m.code); return; }
  if (m.type === 'state') { S = m; render(); }
}
const host = () => S.role === 'host';

// ---------- render ----------
function render() {
  const target = S.phase === 'lobby' ? 'lobby' : S.phase === 'ended' ? 'end' : 'play';
  if (screen !== target) show(target);
  ({ lobby: renderLobby, play: renderPlay, end: renderEnd })[target]();
}
function renderLobby() {
  $('#lcode').textContent = S.code; $('#lurl').textContent = location.origin + location.pathname;
  const box = $('#teamsBox'); box.innerHTML = '';
  for (const t of S.teams) {
    const mem = S.players.filter((p) => p.team === t.id);
    const d = document.createElement('div'); d.className = 'team'; d.style.setProperty('--c', t.color);
    d.innerHTML = `<h3>${esc(t.name)} <span>${mem.length}</span></h3>${mem.map((p) => `<span class="chip">${esc(p.name)}${p.on ? '' : ' ⚠︎'}</span>`).join('') || '<span class="small">No players yet</span>'}` +
      (!host() ? `<button class="btn alt" style="margin-top:8px" data-t="${t.id}">${S.me && S.me.team === t.id ? '✓ Your team' : 'Join this team'}</button>` : '');
    box.appendChild(d);
  }
  document.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => send({ type: 'team', team: +b.dataset.t }));
  const un = S.players.filter((p) => p.team == null);
  $('#unBox').style.display = un.length ? '' : 'none';
  $('#unassigned').innerHTML = un.map((p) => `<span class="chip">${esc(p.name)}${host() ? ' ' + S.teams.map((t) => `<a href="#" data-a="${p.id}:${t.id}" style="color:${t.color};text-decoration:none">●</a>`).join('') : ''}</span>`).join('');
  document.querySelectorAll('[data-a]').forEach((a) => a.onclick = (e) => { e.preventDefault(); const [p, t] = a.dataset.a.split(':'); send({ type: 'assign', player: p, team: +t }); });
  $('#hostLobby').style.display = host() ? '' : 'none';
  $('#waitMsg').textContent = host() ? '' : (S.me && S.me.team != null ? 'You’re in! Waiting for the host to start…' : 'Pick a team above.');
  if (host()) {
    if (document.activeElement.tagName !== 'INPUT') {
      $('#teamCount').value = S.teams.length;
      $('#tnames').innerHTML = S.teams.map((t, i) => `<label style="color:${t.color}">Team ${i + 1}</label><input class="tn" value="${esc(t.name)}" maxlength="18">`).join('');
      document.querySelectorAll('.tn').forEach((i) => i.onchange = pushTeams);
    }
    $('#teamCount').onchange = pushTeams;
    $('#startGame').disabled = S.players.filter((p) => p.team != null).length < 1;
  }
}
function pushTeams() { send({ type: 'teams', count: +$('#teamCount').value, names: [...document.querySelectorAll('.tn')].map((i) => i.value) }); }
$('#startGame').onclick = () => send({ type: 'start' });

function renderPlay() {
  $('#ptitle').textContent = S.boardTitle;
  const g = $('#grid'); let h = S.cats.map((c) => `<div class="cat">${esc(c)}</div>`).join('');
  for (let i = 0; i < 5; i++) for (let c = 0; c < 6; c++) {
    const used = S.used.includes(c + ',' + i);
    h += `<button class="cell ${host() ? '' : 'pl'}" data-c="${c}" data-i="${i}" ${used || !host() || S.phase !== 'board' ? 'disabled' : ''}>$${S.values[i]}</button>`;
  }
  g.innerHTML = h;
  g.querySelectorAll('.cell').forEach((b) => b.onclick = () => send({ type: 'pick', c: +b.dataset.c, i: +b.dataset.i }));
  const sc = $('#score');
  sc.innerHTML = S.teams.map((t) => `<div class="sc ${S.control === t.id ? 'ctl' : ''}" style="--c:${t.color}"><div class="n">${esc(t.name)}</div><div class="s ${t.score < 0 ? 'neg' : ''}">${t.score < 0 ? '-' : ''}$${Math.abs(t.score)}</div>` +
    (host() ? `<div class="adj"><button data-adj="${t.id}:-100">−</button><button data-adj="${t.id}:100">+</button><button data-ctl="${t.id}">★</button></div>` : '') + '</div>').join('');
  sc.querySelectorAll('[data-adj]').forEach((b) => b.onclick = () => { const [t, d] = b.dataset.adj.split(':'); send({ type: 'adjust', team: +t, delta: +d }); });
  sc.querySelectorAll('[data-ctl]').forEach((b) => b.onclick = () => send({ type: 'control', team: +b.dataset.ctl }));
  $('#topBtns').innerHTML = host() && S.phase === 'board'
    ? `<button class="btn sm alt" id="goFinal">${S.used.length >= 30 ? 'Final round ▶' : 'Skip to final ▶'}</button><button class="btn sm alt" id="endNow">End</button>` : '';
  if ($('#goFinal')) $('#goFinal').onclick = () => confirm('Start the final round?') && send({ type: 'final' });
  if ($('#endNow')) $('#endNow').onclick = () => confirm('End the game?') && send({ type: 'end' });
  renderOverlay();
}

let tick;
function renderOverlay() {
  const ov = $('#ov'); const c = S.cur, f = S.final;
  if (!c && !f) { ov.classList.remove('on'); ov.innerHTML = ''; return; }
  const was = ov.classList.contains('on'); ov.classList.add('on'); if (!was) ov.style.animation = 'none', ov.offsetHeight, ov.style.animation = '';
  const t = (id) => S.teams[id];
  const myTeam = S.me && S.me.team;
  if (c) {
    let top = `<div class="ov-top"><span>${esc(c.cat)}</span><span>$${c.value}</span></div>`;
    let body = '', ctl = '';
    if (c.dd && c.stage === 'wager') {
      body = `<div class="clue"><div><div class="dd">Daily Double!</div><div style="font-size:1.6rem;margin-top:12px">${esc(t(c.team).name)}</div></div></div>`;
      if (host()) ctl = `<div class="card ctrl"><label style="margin-top:0">Team playing</label><select id="ddt">${S.teams.map((x) => `<option value="${x.id}" ${x.id === c.team ? 'selected' : ''}>${esc(x.name)} ($${x.score})</option>`).join('')}</select>
        <label>Wager (max $${Math.max(1000, t(c.team).score)})</label><input id="ddw" type="number" min="5" value="${Math.min(500, Math.max(1000, t(c.team).score))}">
        <button class="btn" id="ddgo">Reveal clue</button></div>`;
      else ctl = `<div class="buzzstat">${esc(t(c.team).name)} is choosing a wager…</div>`;
    } else {
      body = `<div class="clue">${esc(c.clue)}</div><div class="answer">${c.answer && (host() || c.showAnswer) ? esc(c.answer) : ''}</div>`;
      const locked = c.buzzed ? `<span style="color:${t(c.buzzed.team).color}">${esc(t(c.buzzed.team).name)}</span> — ${esc(c.buzzed.player)} buzzed!` : c.buzzer === 'open' ? 'Buzzers open!' : c.dd ? `${esc(t(c.team).name)} wagered $${c.wager}` : c.showAnswer ? '' : 'Wait for the host…';
      let stat = `<div class="buzzstat">${locked}</div>`;
      if (c.lockedOut.length) stat += `<div class="small" style="text-align:center">Locked out: ${c.lockedOut.map((i) => esc(t(i).name)).join(', ')}</div>`;
      if (host()) {
        ctl = `<div class="ctrl">${stat}<div class="row">` +
          (!c.dd ? `<button class="btn alt" id="openB" ${c.buzzer === 'open' || c.showAnswer || c.buzzed ? 'disabled' : ''}>Open buzzers</button>` : '') +
          `<button class="btn alt" id="rev" ${c.showAnswer ? 'disabled' : ''}>Show answer</button></div>`;
        const who = c.dd ? c.team : c.buzzed && c.buzzed.team;
        if (who != null && !c.showAnswer) ctl += `<div class="row"><button class="btn good" id="right">✔ Correct (+$${c.dd ? c.wager : c.value})</button><button class="btn bad" id="wrong">✘ Wrong (−$${c.dd ? c.wager : c.value})</button></div>`;
        ctl += `<button class="btn" id="back" style="margin-top:12px">${c.showAnswer ? 'Back to board' : 'Skip clue (no points)'}</button></div>`;
      } else {
        const can = c.buzzer === 'open' && myTeam != null && !c.lockedOut.includes(myTeam);
        ctl = stat + (c.dd ? '' : `<button class="buzzer ${can ? 'pulse' : ''}" id="buzz" ${can ? '' : 'disabled'}>${myTeam == null ? 'No team' : c.lockedOut.includes(myTeam) ? 'Locked out' : 'Buzz!'}</button>`);
      }
    }
    ov.innerHTML = top + body + ctl;
    const on = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
    on('#ddgo', () => { send({ type: 'ddTeam', team: +$('#ddt').value }); send({ type: 'ddWager', amount: +$('#ddw').value }); });
    if ($('#ddt')) $('#ddt').onchange = () => send({ type: 'ddTeam', team: +$('#ddt').value });
    on('#openB', () => send({ type: 'openBuzz' })); on('#rev', () => send({ type: 'reveal' }));
    on('#right', () => send({ type: 'judge', correct: true })); on('#wrong', () => send({ type: 'judge', correct: false }));
    on('#back', () => send({ type: 'close' }));
    on('#buzz', () => { send({ type: 'buzz' }); try { navigator.vibrate && navigator.vibrate(80); } catch {} });
    return;
  }
  // FINAL
  let h = `<div class="ov-top"><span>Final Round</span><span>${esc(f.category)}</span></div>`;
  if (f.stage === 'category') {
    h += `<div class="clue"><div>${esc(f.category)}<div style="font-size:1.1rem;margin-top:14px;color:#a9b6f0;text-transform:none;font-family:Inter">Each team secretly wagers up to its score. Teams with no money can't wager.</div></div></div>`;
    if (host()) h += `<div class="ctrl"><div class="buzzstat">${f.wagered.length}/${S.teams.length} wagers in</div><button class="btn" id="fclue">Reveal clue (30 s)</button></div>`;
    else h += myTeam == null ? '<div class="buzzstat">Spectating</div>' : `<div class="card ctrl"><label style="margin-top:0">Your team’s wager (max $${f.myWagerMax})</label><input id="fw" type="number" min="0" max="${f.myWagerMax}" value="0"><button class="btn" id="fwb">${f.wagered.includes(myTeam) ? 'Update wager ✓' : 'Lock in wager'}</button></div>`;
  } else {
    h += `<div class="clue">${esc(f.clue)}</div>`;
    if (f.stage === 'clue') {
      h += `<div class="buzzstat" id="fcount"></div>`;
      if (host()) h += `<div class="ctrl"><div class="small" style="text-align:center">${f.answered.length}/${S.teams.length} answers in</div><button class="btn" id="freveal">Time’s up — reveal</button></div>`;
      else if (myTeam != null) h += `<div class="card ctrl"><input id="fa" maxlength="80" placeholder="Type your team’s answer" autocomplete="off"><button class="btn" id="fab">${f.answered.includes(myTeam) ? 'Update answer ✓' : 'Submit answer'}</button></div>`;
      clearInterval(tick); tick = setInterval(() => { const s = Math.max(0, Math.ceil((f.deadline - Date.now()) / 1000)); const e = $('#fcount'); if (e) e.textContent = s + 's'; }, 250);
    } else {
      clearInterval(tick);
      h += `<div class="answer">${f.answer ? esc(f.answer) : ''}</div><div class="ctrl card"><table>${S.teams.map((x) => {
        const en = f.entries && f.entries[x.id] || {}, shown = f.revealed.includes(x.id), done = f.judged.includes(x.id);
        return `<tr style="border-left:6px solid ${x.color}"><td><b>${esc(x.name)}</b><div class="small">${shown || host() ? `“${esc(en.answer) || '—'}” · wager $${en.wager ?? 0}` : 'Hidden'}</div></td><td style="text-align:right">` +
          (host() ? (done ? '<span class="small">scored</span>' : `${shown ? '' : `<button class="btn sm alt" data-fs="${x.id}">Show</button> `}<button class="btn sm good" data-fj="${x.id}:1">✔</button> <button class="btn sm bad" data-fj="${x.id}:0">✘</button>`) : done ? '✓' : '') + '</td></tr>';
      }).join('')}</table></div>`;
      if (host()) h += `<div class="ctrl"><button class="btn" id="fend" ${f.judged.length < S.teams.length ? '' : ''}>Finish game</button></div>`;
    }
  }
  ov.innerHTML = h;
  const on = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
  on('#fclue', () => send({ type: 'finalClue' })); on('#freveal', () => send({ type: 'finalReveal' }));
  on('#fwb', () => send({ type: 'finalWager', amount: +$('#fw').value })); on('#fab', () => send({ type: 'finalAnswer', text: $('#fa').value }));
  on('#fend', () => send({ type: 'end' }));
  ov.querySelectorAll('[data-fs]').forEach((b) => b.onclick = () => send({ type: 'finalShow', team: +b.dataset.fs }));
  ov.querySelectorAll('[data-fj]').forEach((b) => b.onclick = () => { const [t, c] = b.dataset.fj.split(':'); send({ type: 'finalJudge', team: +t, correct: c === '1' }); });
}

function renderEnd() {
  const r = [...S.teams].sort((a, b) => b.score - a.score);
  const order = r.length >= 3 ? [r[1], r[0], r[2], ...r.slice(3)] : r.length === 2 ? [r[1], r[0]] : r;
  $('#pod').innerHTML = order.map((t) => `<div style="--c:${t.color};height:${60 + (t === r[0] ? 90 : t === r[1] ? 50 : 20)}px"><div style="font-size:.8rem">${t === r[0] ? '🏆 ' : ''}${esc(t.name)}</div><b style="font-size:1.4rem">${t.score < 0 ? '-' : ''}$${Math.abs(t.score)}</b></div>`).join('');
}
</script>
</body>
</html>
